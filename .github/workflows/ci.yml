# -----------------------------------------------------------------------------
# Continuous Integration
#
# Stages:
#   1. Lint & format
#   2. Full test matrix on Linux
#        • Latest deps on all supported Pythons
#        • Min deps only on oldest Python
#   3. Cross-OS tests on macOS & Windows (latest deps)
#   4. Documentation build (gallery not executed)
#
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions for CI
permissions:
  contents: read

defaults:
  run:
    shell: bash   # consistent shell across Linux/macOS/Windows

env:
  MAIN_PYTHON: "3.14"  # Python for lint, coverage, cross-OS tests, and docs
  UV_PYTHON_DOWNLOADS: never

# -----------------------------------------------------------------------------
# 1) Lint & format
# -----------------------------------------------------------------------------
jobs:
  lint:
    name: Lint & Format (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Select Python for uv
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      # CI intentionally checks against the latest Ruff release.
      - name: Ruff version
        run: uvx ruff@latest --version

      - name: Ruff lint
        run: uvx ruff@latest check --output-format=github

      - name: Ruff format
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: uvx ruff@latest format --check

# -----------------------------------------------------------------------------
# 2) Full test matrix on Linux
# -----------------------------------------------------------------------------
  tests-linux:
    name: Tests (Linux, ${{ matrix.python-version }} • ${{ matrix.deps }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 50
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
      # Authenticate protected-branch uploads without exposing a repository token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Min deps only once (oldest Python)
          - python-version: "3.10"
            deps: "min"
          # Latest deps on all supported Pythons
          - python-version: "3.10"
            deps: "latest"
          - python-version: "3.11"
            deps: "latest"
          - python-version: "3.12"
            deps: "latest"
          - python-version: "3.13"
            deps: "latest"
          - python-version: "3.14"
            deps: "latest"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "min" ]; then
            # Resolve runtime requirements alone, then protect that solution
            # while installing current compatible development tools.
            uv pip compile pyproject.toml --python .venv --resolution lowest-direct --python-version "$UV_PYTHON" --output-file "$RUNNER_TEMP/skfolio-minimum-runtime.txt"
            uv pip install --python .venv --editable . --group dev --constraint "$RUNNER_TEMP/skfolio-minimum-runtime.txt"
          else
            uv pip install --python .venv --upgrade --editable . --group dev
          fi

      - name: List dependencies
        run: uv pip list --python .venv

      - name: Check dependencies
        run: uv pip check --python .venv

      # Use the environment installed above; syncing could change the
      # dependencies selected for the minimum/latest compatibility checks.
      - name: Run tests
        if: ${{ !(matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest') }}
        run: uv run --no-sync pytest -q tests

      # Coverage on a single representative job (Py MAIN_PYTHON + latest)
      - name: Run tests with coverage (main Python • latest only)
        if: ${{ matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest' }}
        run: uv run --no-sync pytest -q --cov=skfolio --cov-report=xml

      # Upload failures block same-repo pull requests, where they reveal an
      # authentication or configuration regression before it reaches `main`.
      # They do not block pushes to `main`, so a Codecov outage cannot hold
      # back the release workflow, and they do not block fork pull requests,
      # whose tokenless uploads can fail intermittently under Codecov rate
      # limits. The step below reports non-blocking failures as a warning.
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest' }}
        uses: codecov/codecov-action@v7
        continue-on-error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          fail_ci_if_error: true
          # Uploads for pushes to `main` and for pull requests opened from
          # branches of this repository require authentication. Pull requests
          # from forks cannot request OIDC tokens and use the tokenless
          # upload path instead.
          use_oidc: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Warn on Codecov upload failure
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: echo '::warning title=Codecov upload failed::Coverage was not uploaded. The Codecov report for this commit is missing and the main branch report may go stale.'

# -----------------------------------------------------------------------------
# 3) Cross-OS tests
# -----------------------------------------------------------------------------
  tests-os:
    name: Cross-OS (${{ matrix.os }} • latest)
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: |
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          uv venv --python "${{ steps.python.outputs.python-path }}"

      - name: Install project (latest deps)
        run: uv pip install --python .venv --upgrade --editable . --group dev

      - name: List dependencies
        run: uv pip list --python .venv

      - name: Check dependencies
        run: uv pip check --python .venv

      - name: Run tests
        run: uv run --no-sync pytest -q tests

# -----------------------------------------------------------------------------
# 4) Documentation build
# -----------------------------------------------------------------------------
  docs:
    name: Docs build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # sphinx-last-updated-by-git needs the full history

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Select Python for uv
        run: echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install documentation environment
        run: uv sync --no-dev --group docs

      # Fast mode checks that the documentation sources build. It skips gallery
      # execution, the JupyterLite site build and the sphinx-llm Markdown sub-build,
      # which the deployment workflow runs in full.
      - name: Build docs in fast mode
        working-directory: ./docs
        env:
          SKFOLIO_DOCS_FAST: "1"
        run: uv run --no-dev --group docs sphinx-build -b html . _build

# -----------------------------------------------------------------------------
# Continuous Integration
#
# Stages:
#   1. Lint & format
#   2. Full test matrix on Linux
#        • Latest deps on all supported Pythons
#        • Min deps only on oldest Python
#   3. Cross-OS tests on macOS & Windows (latest deps)
#   4. Documentation build (gallery not executed)
#
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel outdated runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions for CI
permissions:
  contents: read

defaults:
  run:
    shell: bash   # consistent shell across Linux/macOS/Windows

env:
  MAIN_PYTHON: "3.13"  # primary Python used for linting & coverage

# -----------------------------------------------------------------------------
# 1) Lint & format
# -----------------------------------------------------------------------------
jobs:
  lint:
    name: Lint & Format (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install project (dev extras)
        run: uv pip install -e ".[dev]"

      # Hook environments are keyed by the pinned revs in the config, so the cache
      # is invalidated exactly when a hook is bumped.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.MAIN_PYTHON }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # `.pre-commit-config.yaml` is the single source of truth for lint and format.
      # Invoking ruff directly here as well would reintroduce the drift this job
      # exists to prevent: the hook pins a ruff release while the `dev` extra
      # resolves whatever is current, and the two then enforce different rules.
      - name: Lint and format (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

# -----------------------------------------------------------------------------
# 2) Full test matrix on Linux
# -----------------------------------------------------------------------------
  tests-linux:
    name: Tests (Linux, ${{ matrix.python-version }} • ${{ matrix.deps }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 50
    permissions:
      contents: read
      # Authenticate protected-branch uploads without exposing a repository token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Min deps only once (oldest Python)
          - python-version: "3.10"
            deps: "min"
          # Latest deps on all supported Pythons
          - python-version: "3.10"
            deps: "latest"
          - python-version: "3.11"
            deps: "latest"
          - python-version: "3.12"
            deps: "latest"
          - python-version: "3.13"
            deps: "latest"
          - python-version: "3.14"
            deps: "latest"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "min" ]; then
            uv pip install -e . --resolution=lowest-direct
            uv pip install -e ".[dev]"
          else
            uv pip install -e ".[dev]"
          fi

      # Run tests normally for all jobs except the single coverage job
      - name: Run tests
        if: ${{ !(matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest') }}
        run: uv run pytest -q tests

      # Coverage on a single representative job (Py MAIN_PYTHON + latest)
      - name: Run tests with coverage (main Python • latest only)
        if: ${{ matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest' }}
        run: uv run pytest -q --cov=skfolio --cov-report=xml

      # Upload failures block same-repo pull requests, where they reveal an
      # authentication or configuration regression before it reaches `main`.
      # They do not block pushes to `main`, so a Codecov outage cannot hold
      # back the release workflow, and they do not block fork pull requests,
      # whose tokenless uploads can fail intermittently under Codecov rate
      # limits. The step below reports non-blocking failures as a warning.
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ matrix.python-version == env.MAIN_PYTHON && matrix.deps == 'latest' }}
        uses: codecov/codecov-action@v7
        continue-on-error: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          fail_ci_if_error: true
          # Uploads for pushes to `main` and for pull requests opened from
          # branches of this repository require authentication. Pull requests
          # from forks cannot request OIDC tokens and use the tokenless
          # upload path instead.
          use_oidc: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Warn on Codecov upload failure
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: echo '::warning title=Codecov upload failed::Coverage was not uploaded. The Codecov report for this commit is missing and the main branch report may go stale.'

# -----------------------------------------------------------------------------
# 3) Cross-OS tests
# -----------------------------------------------------------------------------
  tests-os:
    name: Cross-OS (${{ matrix.os }} • latest)
    runs-on: ${{ matrix.os }}
    needs: lint
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install project (latest deps)
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest -q tests

# -----------------------------------------------------------------------------
# 4) Documentation build
# -----------------------------------------------------------------------------
  docs:
    name: Docs build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # sphinx-last-updated-by-git needs the full history

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.MAIN_PYTHON }}

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Create venv
        run: uv venv

      - name: Install project (docs extras)
        run: uv pip install -e ".[docs]"

      # Fast mode checks that the documentation sources build. It skips gallery
      # execution, the JupyterLite site build and the sphinx-llm Markdown sub-build,
      # which the deployment workflow runs in full.
      - name: Build docs in fast mode
        working-directory: ./docs
        run: SKFOLIO_DOCS_FAST=1 uv run sphinx-build -b html . _build

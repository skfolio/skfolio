# This workflow publishes skfolio after CI passes on main.
#
# 1. Read the commit history to decide whether a release is needed and calculate
#    its version. This is only a preview.
# 2. Continue automatically for patch and minor releases. For a major release,
#    wait for a maintainer to approve the proposed version in GitHub.
# 3. Before preparing the release, check that main still points to the tested
#    commit and that the proposed version is unchanged. Stop if either has changed.
# 4. Create the version commit, tag and GitHub release, then save the package
#    distributions as a workflow artifact.
# 5. Publish the saved distributions to PyPI and GitHub in a separate job.
#
# GitHub environments control the approval step: release has no required
# reviewers, while major-release requires a maintainer's approval.
# After preparation succeeds, "Re-run failed jobs" retries publication using
# the original artifact. Full reruns are blocked by the stale-commit check after
# the version commit advances main. Reruns use the original workflow definition,
# so they cannot pick up fixes to the publishing job.
name: Semantic Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Serialize releases and retain queued runs while approval is pending.
concurrency:
  group: release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CI_SHA: ${{ github.event.workflow_run.head_sha }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Preview release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.repository == 'skfolio/skfolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.preview.outputs.released }}
      version: ${{ steps.preview.outputs.version }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Stop obsolete queued runs before they can request approval.
      - name: Check the tested commit is still current
        run: |
          if [[ "$(git rev-parse HEAD)" != "$CI_SHA" ]]; then
            echo "::error::main changed. Wait for CI on the latest commit."
            exit 1
          fi

      - uses: python-semantic-release/python-semantic-release@v10.7.0
        id: preview
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: true

      - name: Select release environment
        id: plan
        if: steps.preview.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.preview.outputs.previous_version }}
          NEXT_VERSION: ${{ steps.preview.outputs.version }}
        run: |
          environment=release
          if [[ "${NEXT_VERSION%%.*}" != "${PREVIOUS_VERSION%%.*}" ]]; then
            environment=major-release
            # GitHub creates missing environments without protection rules.
            if ! protected=$(gh api "repos/$GITHUB_REPOSITORY/environments/major-release" \
              --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))') || [[ "$protected" != true ]]; then
              echo "::error::Cannot confirm required reviewers for major-release. Check the environment and its required reviewers."
              exit 1
            fi
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          printf '## Release %s → %s\n\nTested commit: `%s`\n\n[Changes](%s/%s/compare/v%s...%s)\n' \
            "$PREVIOUS_VERSION" "$NEXT_VERSION" "$CI_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$PREVIOUS_VERSION" "$CI_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Prepare v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub applies the environment's approval rules before this job starts.
    environment:
      name: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      artifact_id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # main may have advanced while this run awaited approval.
      - name: Check the tested commit is still current
        run: |
          if [[ "$(git rev-parse HEAD)" != "$CI_SHA" ]]; then
            echo "::error::main changed. Wait for CI on the latest commit."
            exit 1
          fi

      # Tags may have changed, so we recheck the version before preparing the release.
      - uses: python-semantic-release/python-semantic-release@v10.7.0
        id: preview
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: true

      - name: Check the proposed version
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          NEXT_VERSION: ${{ steps.preview.outputs.version }}
          RELEASE_PLANNED: ${{ steps.preview.outputs.released }}
        run: |
          if [[ "$RELEASE_PLANNED" != true || "$NEXT_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release version changed. Re-run all jobs for a fresh preview."
            exit 1
          fi

      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ steps.generate_token.outputs.token }}

      - name: Check package distributions
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -f "dist/skfolio-${VERSION}-py3-none-any.whl"
          test -f "dist/skfolio-${VERSION}.tar.gz"

      - name: Save package distributions
        id: distributions
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish v${{ needs.release.outputs.version }}
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish package distributions to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="v$VERSION"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | [.name, .state] | @tsv')
          # The PyPI step also adds publish attestations to dist/.
          for file in dist/*; do
            name=${file##*/}
            if grep -Fxq -- "$name"$'\tuploaded' <<< "$assets"; then
              continue
            fi
            # A failed upload can leave an incomplete asset that blocks a new upload.
            if cut -f1 <<< "$assets" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
          done

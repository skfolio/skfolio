default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: LICENSE

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version CI resolves from the `dev` extra.
    rev: v0.16.5
    hooks:
      # `[tool.ruff] include` is ignored for paths passed explicitly on the command
      # line, which is how pre-commit invokes ruff. Without `files`, the hooks would
      # lint `examples/` and `docs/` — sphinx-gallery sources that the project
      # deliberately keeps out of scope — and disagree with CI.
      - id: ruff
        name: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/.*\.py$
      - id: ruff-format
        name: ruff-format
        files: ^(src|tests)/.*\.py$

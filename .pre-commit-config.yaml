default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: LICENSE

  # Use Ruff from the local development environment. CI checks the latest release.
  - repo: local
    hooks:
      # Explicit filenames bypass Ruff's `include`, so match its scope here.
      - id: ruff
        name: ruff-lint
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: unsupported
        files: ^(pyproject\.toml|conftest\.py|(src|tests|examples)/.*\.py)$
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: unsupported
        types: [python]
        files: ^(conftest\.py|(src|tests|examples)/.*\.py)$
        require_serial: true
